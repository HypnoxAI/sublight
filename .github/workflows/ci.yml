name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build & test (${{ matrix.image }})
    strategy:
      # Both images run to completion: one failing must not hide the other's
      # result, which is the whole reason two are here.
      fail-fast: false
      matrix:
        # TWO images on purpose, and not interchangeable.
        #
        # macos-26 carries the toolchain this project is developed and verified
        # on, and the swift-format that produced the tree-wide reformat. The
        # formatting gate runs there and only there, so the formatter and the
        # gate are the same version by construction rather than by luck — a
        # config generated by one version was already found to be unreadable by
        # another, which failed the gate open until it was caught.
        #
        # macos-15 carries an older Swift 6. It is kept because it is STRICTER
        # in practice: its concurrency analysis rejected two things and warned
        # about twenty more that the newer compiler infers its way past, and
        # every one of those was a real gap worth closing. Dropping it would
        # trade away coverage that has already paid for itself.
        image: [macos-26, macos-15]
    runs-on: ${{ matrix.image }}
    env:
      # The version that formatted the tree. A runner image bump that moves
      # swift-format must fail HERE, loudly, rather than as a wall of
      # unexplained lint diffs.
      EXPECTED_SWIFT_FORMAT: "6.3.0"
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
          swift format --version
          swift --version 2>&1 | grep -qE 'Swift version 6' \
            || { echo "::error::expected a Swift 6 toolchain on this runner image"; exit 1; }
      - name: Formatting
        # Only on the image whose formatter produced the reformat.
        if: matrix.image == 'macos-26'
        run: |
          actual=$(swift format --version)
          if [ "$actual" != "$EXPECTED_SWIFT_FORMAT" ]; then
            echo "::error::swift-format is $actual but the tree was formatted with $EXPECTED_SWIFT_FORMAT."
            echo "::error::Reformat on the new version and update EXPECTED_SWIFT_FORMAT, or pin the image back."
            exit 1
          fi
          swift format lint --strict --recursive Sources Tests Package.swift
      - name: Build CLI
        run: swift build -c release --product sublight-cli
      - name: Build app
        run: swift build -c release --product SublightApp
      - name: Tests
        run: swift test
