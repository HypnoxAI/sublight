name: Bug report
description: Something misbehaves, fails to build, or doesn't dim
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Sublight drives an undocumented Apple framework across hardware that
        genuinely differs machine to machine, so the fields below are not
        boilerplate — they are usually the whole diagnosis. An issue without
        them generally cannot be acted on.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and build
      description: "Apple menu → About This Mac → More Info, or `sw_vers`. Include the build number."
      placeholder: "26.6.1 (25G76)"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Mac model identifier
      description: "`sysctl -n hw.model`, or Settings → About. Not the marketing name."
      placeholder: "Mac16,12"
    validations:
      required: true
  - type: textarea
    id: dump
    attributes:
      label: sublight-cli dump
      description: |
        Paste the full output of `sublight-cli dump`. This lists the private
        framework's real method table on *your* machine, which is the single
        most useful thing for diagnosing anything backlight-related — it is how
        we tell "Apple changed the interface" apart from "Sublight has a bug".
        Add `sublight-cli sig` output too if the app refused to start.
      render: text
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics block
      description: "Sublight menu → gear → Diagnostics → Copy, then paste here. Your coordinates are never included."
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: This is an Apple Silicon MacBook with a built-in backlit keyboard
          required: true
        - label: I ran the guided calibration (Settings → General) — or the bug is that calibration itself fails
          required: false
        - label: If the keys go fully dark for a second or more at a time, I checked the stability-ceiling note in the README's Known limitations
          required: false
