<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="1024" height="1024">
  <!-- Sublight app icon, amber edition. The sine is the dither engine drawn as
       an actual backlight: lit amber keys above it, dimmed keys below. Crest,
       trough, crest — amplitudes in golden-ratio proportion on a rising
       midline. Same geometry as the menu-bar glyph.
       Rules: no nested masks; rasterise via make_icons.sh. -->
  <defs>
    <g id="keys">
      <rect x="7"  y="15" width="26" height="14" rx="3.5"/>
      <rect x="34" y="15" width="26" height="14" rx="3.5"/>
      <rect x="61" y="15" width="26" height="14" rx="3.5"/>
      <rect x="7"  y="34" width="26" height="14" rx="3.5"/>
      <rect x="34" y="34" width="26" height="14" rx="3.5"/>
      <rect x="61" y="34" width="26" height="14" rx="3.5"/>
      <rect x="7"  y="53" width="26" height="14" rx="3.5"/>
      <rect x="34" y="53" width="53" height="14" rx="3.5"/>
    </g>
    <path id="wave" d="M -2,56 C 4,52.8 9,49.5 16,49.5 C 28,49.5 40,55.5 52,55.5 C 64,55.5 76,34.5 88,34.5 C 94,34.5 100,38 106,44"/>
    <clipPath id="plate"><rect x="1" y="6" width="94" height="68" rx="12"/></clipPath>
    <mask id="above">
      <rect x="-4" y="-4" width="108" height="92" fill="#000"/>
      <path d="M -2,56 C 4,52.8 9,49.5 16,49.5 C 28,49.5 40,55.5 52,55.5 C 64,55.5 76,34.5 88,34.5 C 94,34.5 100,38 106,44 L 106,-4 L -2,-4 Z" fill="#fff"/>
    </mask>
    <mask id="below">
      <rect x="-4" y="-4" width="108" height="92" fill="#000"/>
      <path d="M -2,56 C 4,52.8 9,49.5 16,49.5 C 28,49.5 40,55.5 52,55.5 C 64,55.5 76,34.5 88,34.5 C 94,34.5 100,38 106,44 L 106,86 L -2,86 Z" fill="#fff"/>
    </mask>
  </defs>

  <rect width="96" height="96" rx="21" fill="#101012"/>

  <g transform="translate(0,8)">
    <rect x="1" y="6" width="94" height="68" rx="12" fill="#17171a"/>
    <g clip-path="url(#plate)">
      <g mask="url(#above)"><use href="#keys" fill="#ffb24d"/></g>
      <g mask="url(#below)">
        <use href="#keys" fill="#ffb24d" fill-opacity="0.18"/>
        <use href="#keys" fill="none" stroke="#ffb24d" stroke-opacity="0.55" stroke-width="1.4"/>
      </g>
      <use href="#wave" fill="none" stroke="#ffd9a0" stroke-width="3.6" stroke-linecap="round"/>
    </g>
    <rect x="1" y="6" width="94" height="68" rx="12" fill="none" stroke="#ffb24d" stroke-opacity="0.95" stroke-width="1.6"/>
  </g>
</svg>
