      <rect x="7"  y="34" width="26" height="14" rx="3.5"/>
      <rect x="34" y="34" width="26" height="14" rx="3.5"/>
      <rect x="61" y="34" width="26" height="14" rx="3.5"/>
      <rect x="7"  y="53" width="26" height="14" rx="3.5"/>
      <rect x="34" y="53" width="53" height="14" rx="3.5"/>
    </g>
    <clipPath id="plate"><rect x="1" y="6" width="94" height="68" rx="12"/></clipPath>
    <mask id="above">
